rad-bat-refresh-dane-gcc-11-2-1-numa:
  extends: .job_on_dane
  rules:
    - if: '$RAD_BAT_REFRESH_TARGET == null || $RAD_BAT_REFRESH_TARGET == "" || $RAD_BAT_REFRESH_TARGET == "dane/gcc_11_2_1_numa"'
      when: on_success
    - when: never
  variables:
    SPEC: "~shared +fortran +numa +tools tests=basic %gcc@=11.2.1"
    RSCI_JOB_CMD: "./scripts/radiuss-spack-configs/bin/rad-bat ci"
    RAD_BAT_MODE: "spack"
    RAD_BAT_JOBS: "28"
    RAD_BAT_WORK_DIR: "/dev/shm/rad-bat-${CI_JOB_ID}"
    RAD_BAT_INSTALL_TREE: "/usr/workspace/umdev/rad-bat/umpire/dane/${CI_PIPELINE_ID}/install"
    RAD_BAT_OUTPUT_DIR: "${CI_PROJECT_DIR}/.rad-bat-artifacts/host-configs"
    RAD_BAT_BUILDCACHE: "oci://${CI_REGISTRY_IMAGE}"
    RAD_BAT_BUILDCACHE_USERNAME_VARIABLE: "CI_REGISTRY_USER"
    RAD_BAT_BUILDCACHE_PASSWORD_VARIABLE: "CI_JOB_TOKEN"
    RAD_BAT_HOST_CONFIG_NAME: "dane-gcc-11-2-1-numa.cmake"
