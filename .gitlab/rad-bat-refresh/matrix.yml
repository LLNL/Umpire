rad-bat-refresh-matrix-clang-18-cuda-12-6:
  extends: .job_on_matrix
  rules:
    - if: '$RAD_BAT_REFRESH_TARGET == null || $RAD_BAT_REFRESH_TARGET == "" || $RAD_BAT_REFRESH_TARGET == "matrix/clang_18_1_8_gcc_13_cuda_12_6_0"'
    - when: never
  variables:
    SPEC: "${PROJECT_MATRIX_VARIANTS} +deviceconst %clang-18-gcc-13 ^cmake@3.25.2 ^cuda@12.6.0+allow-unsupported-compilers ${PROJECT_MATRIX_DEPS}"
    RSCI_JOB_CMD: "./scripts/radiuss-spack-configs/bin/rad-bat ci"
    RAD_BAT_MODE: "spack"
    RAD_BAT_DEST: "/dev/shm/rad-bat-${CI_JOB_ID}"
    RAD_BAT_INSTALL_TREE: "/usr/workspace/umdev/rad-bat/umpire/matrix/${CI_PIPELINE_ID}/install"
    RAD_BAT_OUTPUT_DIR: "${CI_PROJECT_DIR}/.rad-bat-artifacts/host-configs"
    RAD_BAT_HOST_CONFIG_NAME: "matrix-clang-18-cuda-12-6.cmake"
