# This file defines JOB TEMPLATES ONLY.
# It is included in CHILD pipelines (via trigger: include:) to provide
# templates that your jobs can extend.

###############################################################################
# JOB CUSTOMIZATION TEMPLATES
###############################################################################

# Configuration shared by build and test jobs specific to this project.
# Not all configuration can be shared. Here projects can fine tune the
# CI behavior.
.custom_job:
  artifacts:
    reports:
      junit: junit.xml
    name: "${CI_PROJECT_NAME}-${CI_MACHINE}-${CI_JOB_NAME}-${CI_PIPELINE_ID}"
    paths:
      - ./*.cmake

# Initial native-Spack canaries. Once their generated host-configs have been
# reviewed and committed, ordinary jobs can use rad-bat's host-config mode.
.rad_bat_spack_canary:
  variables:
    RSCI_JOB_CMD: "./scripts/radiuss-spack-configs/bin/rad-bat ci"
    RAD_BAT_MODE: "spack"
    RAD_BAT_DEST: "/dev/shm/rad-bat-${CI_JOB_ID}"

.reproducer_vars:
  script:
    - |
      echo -e "
      # Required variables \n
      export MODULE_LIST=\"${MODULE_LIST}\" \n
      export SPEC=\"${SPEC//\"/\\\"}\" \n
      export RAD_BAT_MODE=\"${RAD_BAT_MODE:-}\" \n
      export RAD_BAT_DEST=\"${RAD_BAT_DEST:-}\" \n
      # Allow to set job script for debugging (only this differs from CI) \n
      export DEBUG_MODE=true \n
      # Using the CI build cache is optional and requires a token. Set it like so: \n
      # export REGISTRY_TOKEN=\"<your token here>\" \n"
