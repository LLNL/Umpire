on:
  push:
    branches:
      - main
      - develop
      - feature/api-refactor
  pull_request: []
  workflow_dispatch: {}

name: API v2 Tests

env:
  API_V2_EXCLUDE_REGEX: api_v2_fixed_pool_tests
  API_V2_HOST_TARGETS: >-
    api_v2_registry_tests api_v2_memory_tests api_v2_memory_resource_tests
    api_v2_allocator_tests api_v2_allocation_strategy_tests
    api_v2_host_memory_tests api_v2_null_resource_tests
    api_v2_thread_safe_tests api_v2_dynamic_pool_list_tests
    api_v2_quick_pool_tests api_v2_size_limiter_tests
    api_v2_monotonic_buffer_tests api_v2_named_tests
    api_v2_registry_threading_tests api_v2_memory_threading_tests
    api_v2_thread_safe_stress_tests api_v2_stl_compatibility_tests
    api_v2_operations_headers_tests api_v2_operations_tests
    api_v2_v1_interop_tests
  API_V2_TSAN_TARGETS: >-
    api_v2_registry_threading_tests api_v2_memory_threading_tests
    api_v2_thread_safe_stress_tests

jobs:
  build_clang:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang ninja-build
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DENABLE_WARNINGS_AS_ERRORS=Off \
          -DUMPIRE_ENABLE_DEVELOPER_DEFAULTS=On \
          -DUMPIRE_ENABLE_TESTS=On
    - name: Build
      run: cmake --build build --parallel --target $API_V2_HOST_TARGETS
    - name: Test
      run: |
        ctest --test-dir build \
          -R '^api_v2_' \
          -E "$API_V2_EXCLUDE_REGEX" \
          --output-on-failure

  asan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang ninja-build
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS='-fsanitize=address' \
          -DENABLE_WARNINGS_AS_ERRORS=Off \
          -DUMPIRE_ENABLE_DEVELOPER_DEFAULTS=On \
          -DUMPIRE_ENABLE_TESTS=On \
          -DUMPIRE_ENABLE_TOOLS=On \
          -DUMPIRE_ENABLE_ASAN=On \
          -DUMPIRE_ENABLE_SANITIZER_TESTS=On
    - name: Build
      run: cmake --build build --parallel --target $API_V2_HOST_TARGETS
    - name: Test
      run: |
        ctest --test-dir build \
          -R '^api_v2_' \
          -E "$API_V2_EXCLUDE_REGEX" \
          --output-on-failure

  tsan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang ninja-build
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS='-fsanitize=thread' \
          -DCMAKE_CXX_FLAGS='-fsanitize=thread' \
          -DENABLE_WARNINGS_AS_ERRORS=Off \
          -DUMPIRE_ENABLE_DEVELOPER_DEFAULTS=On \
          -DUMPIRE_ENABLE_TESTS=On \
          -DUMPIRE_ENABLE_TSAN=On \
          -DUMPIRE_ENABLE_SANITIZER_TESTS=On
    - name: Build
      run: cmake --build build --parallel --target $API_V2_TSAN_TARGETS
    - name: Test
      run: |
        ctest --test-dir build \
          -R 'api_v2_registry_threading_tests|api_v2_memory_threading_tests|api_v2_thread_safe_stress_tests' \
          --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Install coverage tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov ninja-build
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_WARNINGS_AS_ERRORS=Off \
          -DUMPIRE_ENABLE_DEVELOPER_DEFAULTS=On \
          -DUMPIRE_ENABLE_TESTS=On \
          -DENABLE_COVERAGE=On
    - name: Build API v2 coverage target
      run: cmake --build build --parallel --target coverage_api_v2
    - uses: actions/upload-artifact@v4
      with:
        name: api-v2-coverage
        path: |
          build/coverage_api_v2
          build/coverage_api_v2.info
          build/coverage_api_v2.info.cleaned

  build_mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_WARNINGS_AS_ERRORS=Off \
          -DUMPIRE_ENABLE_DEVELOPER_DEFAULTS=On \
          -DUMPIRE_ENABLE_DEVELOPER_BENCHMARKS=On \
          -DUMPIRE_ENABLE_TESTS=On
    - name: Build
      run: cmake --build build --parallel --target $API_V2_HOST_TARGETS
    - name: Run API v2 tests
      run: |
        ctest --test-dir build \
          -R '^api_v2_' \
          -E "$API_V2_EXCLUDE_REGEX" \
          --output-on-failure

  # Optional device-validation entry point for future API v2 CUDA/HIP/SYCL work.
  # This job does not currently run any API v2 device tests; it exists to
  # provide a hardware-capable CI path on GPU-equipped runners for follow-up
  # beads such as umpire-4og, umpire-728, and umpire-e2h.
  device_gpu_docker:
    name: API v2 Device (Docker skeleton on radiuss-cuda-runners)
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        target: [cuda, cuda13, hip, sycl]
    runs-on: radiuss-cuda-runners
    steps:
    - run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        # Reuse the existing Dockerfile targets used by build.yml; future
        # device-validation beads are expected to extend these stages (or add
        # new ones) with API v2 device tests.
        target: ${{ matrix.target }}
