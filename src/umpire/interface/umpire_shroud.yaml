copyright:
  - Copyright (c) 2016-26, Lawrence Livermore National Security, LLC and Umpire
  - project contributors. See the COPYRIGHT file for details.
  -
  - "SPDX-License-Identifier: (MIT)"

library: Umpire
namespace: umpire
cxx_header: umpire/Umpire.hpp

options:
  F_module_per_class: False
  C_API_case: lower
  wrap_python: False

format:
  C_prefix: umpire_

declarations:
  - decl: bool pointer_overlaps(void* left, void* right)
  - decl: bool pointer_contains(void* left, void* right)
  - decl: string get_backtrace(void* ptr)
  - decl: size_t get_process_memory_usage()
  - decl: size_t get_process_memory_usage_hwm()
  - decl: size_t get_device_memory_usage(int device_id)
  - decl: int get_major_version()
  - decl: int get_minor_version()
  - decl: int get_patch_version()

  - decl: namespace strategy
    options:
      flatten_namespace: True
    declarations:
      - decl: class DynamicPoolList
        cxx_header: umpire/strategy/DynamicPoolList.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class QuickPool
        cxx_header: umpire/strategy/QuickPool.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class AllocationAdvisor
        cxx_header: umpire/strategy/AllocationAdvisor.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class NamedAllocationStrategy
        cxx_header: umpire/strategy/NamedAllocationStrategy.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class FixedPool
        cxx_header: umpire/strategy/FixedPool.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class AllocationPrefetcher
        cxx_header: umpire/strategy/AllocationPrefetcher.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class ThreadSafeAllocator
        cxx_header: umpire/strategy/ThreadSafeAllocator.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class AlignedAllocator
        cxx_header: umpire/strategy/AlignedAllocator.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class SizeLimiter
        cxx_header: umpire/strategy/SizeLimiter.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class MixedPool
        cxx_header: umpire/strategy/MixedPool.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class MonotonicAllocationStrategy
        cxx_header: umpire/strategy/MonotonicAllocationStrategy.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class NamingShim
        cxx_header: umpire/strategy/NamingShim.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class ResourceAwarePool
        cxx_header: umpire/strategy/ResourceAwarePool.hpp
        options:
          wrap_c: false
          wrap_fortran: false

      - decl: class SlotPool
        cxx_header: umpire/strategy/SlotPool.hpp
        options:
          wrap_c: false
          wrap_fortran: false

  - decl: class Allocator
    cxx_header: umpire/Allocator.hpp
    format:
      F_derived_name: UmpireAllocator

    declarations:
      - decl: ~Allocator() +name(delete)
      - decl: void* allocate(size_t bytes)
        format:
          F_name_function: allocate_pointer
      - decl: void deallocate (void* ptr)
        format:
          F_name_function: deallocate_pointer
      - decl: void release()
      - decl: size_t getSize(void* ptr)
      - decl: size_t getHighWatermark()
      - decl: size_t getCurrentSize()
      - decl: size_t getActualSize()
      - decl: size_t getAllocationCount()
      - decl: const std::string& getName() +pure
      - decl: size_t getId()

  - decl: class ResourceManager
    cxx_header: umpire/ResourceManager.hpp
    format:
      F_derived_name: UmpireResourceManager
      F_name_instance_set:
      F_name_instance_get:

    declarations:
      - decl: static ResourceManager& getInstance()

      - decl: Allocator getAllocator(const std::string& name)
        format:
          function_suffix: _by_name

      - decl: Allocator getAllocator(const int id)
        format:
          function_suffix: _by_id

      - decl: template <typename T> Allocator makeAllocator(const std::string& name, Allocator allocator, size_t initial_size, size_t block);
        options:
          F_create_generic: False
        cxx_template:
        - instantiation: <umpire::strategy::DynamicPoolList>
          format:
            F_name_impl_template: make_alloc_dynamic_p_list
            template_suffix: _list_pool
            function_suffix: ""
        - instantiation: <umpire::strategy::QuickPool>
          format:
            F_name_impl_template: make_alloc_quick_p
            template_suffix: _quick_pool
            function_suffix: ""
        - instantiation: <umpire::strategy::ResourceAwarePool>
          format:
            F_name_impl_template: make_alloc_res_aware_p
            template_suffix: _resource_aware_pool
            function_suffix: ""

      - decl: template <typename T> Allocator makeAllocator(const std::string& name, Allocator allocator, const std::string& advice_op, int device_id);
        options:
          F_create_generic: False
        cxx_template:
        - instantiation: <umpire::strategy::AllocationAdvisor>
          format:
            F_name_impl_template: make_alloc_alloc_advisor
            template_suffix: _advisor
            function_suffix: ""

      - decl: template <typename T> Allocator makeAllocator(const std::string& name, Allocator allocator);
        options:
          F_create_generic: False
        cxx_template:
        - instantiation: <umpire::strategy::NamedAllocationStrategy>
          format:
            F_name_impl_template: make_alloc_named_alloc
            template_suffix: _named
            function_suffix: ""
        - instantiation: <umpire::strategy::ThreadSafeAllocator>
          format:
            F_name_impl_template: make_alloc_thread_safe
            template_suffix: _thread_safe
            function_suffix: ""

      - decl: template <typename T> Allocator makeAllocator(const std::string& name, Allocator allocator, size_t object_size);
        options:
          F_create_generic: False
        cxx_template:
          - instantiation: <umpire::strategy::FixedPool>
            format:
              F_name_impl_template: make_alloc_fixed_p
              template_suffix: _fixed_pool
              function_suffix: ""
          - instantiation: <umpire::strategy::AlignedAllocator>
            format:
              F_name_impl_template: make_alloc_aligned_alloc
              template_suffix: _aligned_allocator
              function_suffix: ""
          - instantiation: <umpire::strategy::SizeLimiter>
            format:
              F_name_impl_template: make_alloc_size_limit
              template_suffix: _size_limiter
              function_suffix: ""
          - instantiation: <umpire::strategy::MonotonicAllocationStrategy>
            format:
              F_name_impl_template: make_alloc_monotonic
              template_suffix: _monotonic
              function_suffix: ""
          - instantiation: <umpire::strategy::SlotPool>
            format:
              F_name_impl_template: make_alloc_slot_p
              template_suffix: _slot_pool
              function_suffix: ""

      - decl: template <typename T> Allocator makeAllocator(const std::string& name, Allocator allocator);
        options:
          F_create_generic: False
        cxx_template:
          - instantiation: <umpire::strategy::NamingShim>
            format:
              F_name_impl_template: make_alloc_naming_shim
              template_suffix: _naming_shim
              function_suffix: ""

      - decl: template <typename T> Allocator makeAllocator(const std::string& name, Allocator allocator, size_t smallest_fixed_obj_size, size_t largest_fixed_obj_size, size_t max_initial_fixed_pool_size, size_t fixed_size_multiplier, size_t quick_pool_initial_alloc_size, size_t quick_pool_min_alloc_size, size_t quick_pool_align_bytes);
        options:
          F_create_generic: False
        cxx_template:
          - instantiation: <umpire::strategy::MixedPool>
            format:
              F_name_impl_template: make_alloc_mixed_p
              template_suffix: _mixed_pool
              function_suffix: ""

      - decl: template <typename T> Allocator makeAllocator(const std::string& name, Allocator allocator, int device_id);
        options:
          F_create_generic: False
        cxx_template:
          - instantiation: <umpire::strategy::AllocationPrefetcher>
            format:
              F_name_impl_template: make_alloc_alloc_prefetch
              template_suffix: _prefetcher
              function_suffix: ""

      # Untracked pool allocators use the bool template instantiations directly.
      # Keep the template suffixes short so generated Fortran bufferify helpers
      # stay below compiler identifier limits. The generated C bufferify
      # wrappers for these explicit non-type template instantiations are
      # corrected via the C splicer file listed below.
      - decl: template <typename T, bool B> Allocator makeAllocator(const std::string& name, Allocator allocator, size_t initial_size, size_t block);
        options:
          F_create_generic: False
        cxx_template:
        - instantiation: <umpire::strategy::DynamicPoolList, false>
          format:
            F_name_impl_template: make_alloc_dynamic_p_list_u
            template_suffix: _dynamic_p_list_u
            function_suffix: ""
        - instantiation: <umpire::strategy::QuickPool, false>
          format:
            F_name_impl_template: make_alloc_quick_p_u
            template_suffix: _quick_p_u
            function_suffix: ""
        - instantiation: <umpire::strategy::ResourceAwarePool, false>
          format:
            F_name_impl_template: make_alloc_res_aware_p_u
            template_suffix: _res_aware_p_u
            function_suffix: ""

      - decl: template <typename T, bool B> Allocator makeAllocator(const std::string& name, Allocator allocator, size_t object_size);
        options:
          F_create_generic: False
        cxx_template:
          - instantiation: <umpire::strategy::FixedPool, false>
            format:
              F_name_impl_template: make_alloc_fixed_p_u
              template_suffix: _fixed_p_u
              function_suffix: ""
          - instantiation: <umpire::strategy::MonotonicAllocationStrategy, false>
            format:
              F_name_impl_template: make_alloc_monotonic_u
              template_suffix: _monotonic_u
              function_suffix: ""
          - instantiation: <umpire::strategy::SlotPool, false>
            format:
              F_name_impl_template: make_alloc_slot_p_u
              template_suffix: _slot_p_u
              function_suffix: ""

      - decl: template <typename T, bool B> Allocator makeAllocator(const std::string& name, Allocator allocator, size_t smallest_fixed_obj_size, size_t largest_fixed_obj_size, size_t max_initial_fixed_pool_size, size_t fixed_size_multiplier, size_t quick_pool_initial_alloc_size, size_t quick_pool_min_alloc_size, size_t quick_pool_align_bytes);
        options:
          F_create_generic: False
        cxx_template:
          - instantiation: <umpire::strategy::MixedPool, false>
            format:
              F_name_impl_template: make_alloc_mixed_p_u
              template_suffix: _mixed_p_u
              function_suffix: ""

      - decl: void addAlias(const std::string& name, Allocator allocator)
      - decl: void removeAlias(const std::string& name, Allocator allocator)

      - decl: void destroyAllocator(const std::string& name, bool free_allocations=false)
        doxygen:
          brief: Destroy an allocator by name
        default_arg_suffix:
          - _by_name
          - _by_name_with_free

      - decl: void destroyAllocator(int id, bool free_allocations=false)
        doxygen:
          brief: Destroy an allocator by ID
        default_arg_suffix:
          - _by_id
          - _by_id_with_free

      - decl: Allocator getAllocator(void* ptr)
        format:
          function_suffix: _for_ptr

      - decl: bool isAllocator(const std::string& name)
        format:
          function_suffix: _name

      - decl: bool isAllocator(int id)
        format:
          function_suffix: _id

      - decl: bool hasAllocator(void* ptr)

      - decl: void copy(void* src_ptr, void* dst_ptr, size_t size=0)
        default_arg_suffix:
          - _all
          - _with_size

      - decl: void memset(void* ptr, int val, size_t length=0)
        default_arg_suffix:
          - _all
          - _with_size

      - decl: void* reallocate(void* src_ptr, size_t size)
        format:
          function_suffix: _default

      - decl: void* reallocate(void* src_ptr, size_t size, Allocator allocator)
        format:
          function_suffix: _with_allocator

      - decl: void* move(void* src_ptr, Allocator allocator)

      - decl: void deallocate(void* ptr)

      - decl: size_t getSize(void* ptr)

      - decl: void registerAllocation(void* ptr, size_t size, Allocator allocator)
        splicer:
          c: |
            umpire::Allocator *SHCXX_allocator = static_cast<umpire::Allocator *>(allocator.addr);
            umpire::strategy::AllocationStrategy *SHCXX_strategy = SHCXX_allocator->getAllocationStrategy();
            SH_this->registerAllocation(ptr, umpire::util::AllocationRecord{ptr, size, SHCXX_strategy});

      - decl: void deregisterAllocation(void* ptr)

splicer:
  c:
  - c_fortran/gencumpiresplicer.inc
  f:
  - c_fortran/genfumpiresplicer.f
